<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#bba6f7;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#89b4fa;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#91d7e3;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#d5b8f5;stop-opacity:0.7" />
            <stop offset="100%" style="stop-color:#a6e3a1;stop-opacity:0.5" />
        </linearGradient>
    </defs>
    
    <!-- Background circle -->
    <circle cx="256" cy="256" r="240" fill="#1e1e2e"/>
    
    <!-- Main mountain -->
    <path d="M 256 140 L 380 400 L 132 400 Z" fill="url(#grad1)" />
    
    <!-- Side mountain -->
    <path d="M 340 220 L 440 400 L 240 400 Z" fill="url(#grad2)" opacity="0.8" />
    
    <!-- Subtle glow circle -->
